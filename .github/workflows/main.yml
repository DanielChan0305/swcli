name: Templates Build and Test
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: build make
        working-directory: ./library/build
        run: cmake ..
        
      - name: make
        working-directory: ./library/build
        run: make
        
      - name: Test
        run: ./tests
